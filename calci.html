<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #eaf4ff;
            font-family:Arial, Helvetica, sans-serif;
        }
        .main {
            width: 100%;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-item: center;
            padding:20px;
        }

        .calci {
            width: 100%;
            max-width: 400px;

            padding: 20px;
            background-color: white;
            border: 3px solid #2563eb;
            border-radius: 15px;
            box-shadow: 0 5px 15px #b5c7e6;
        }

        .display {
            width: 100%;
            height: 80px;
            padding: 10px;
            margin-bottom: 15px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            background-color: white;
            color: #2563eb;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            font-size: 25px;
            font-weight: bold;

            overflow: hidden;
        }

        .line {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        button {
            flex: 1;
            height: 60px;
            border: 2px solid #2563eb;
            border-radius: 8px;
            background-color: #eaf4ff;
            color: #2563eb;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2563eb;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Mobile */
        @media (max-width: 500px) {

            .calci {
                padding: 15px;
            }

            button {
                height: 55px;
                font-size: 16px;
            }

            .display {
                height: 70px;
                font-size: 22px;
            }
        }

    </style>

</head>

<body>

    <div class="main">

        <div class="calci">

            <div class="display"></div>

            <div class="btn-ln1 line">
                <button>AC</button>
                <button>%</button>
                <button>cut</button>
                <button>/</button>
            </div>

            <div class="btn-ln2 line">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button>*</button>
            </div>

            <div class="btn-ln3 line">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button>-</button>
            </div>

            <div class="btn-ln4 line">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button>+</button>
            </div>

            <div class="btn-ln5 line">
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button>=</button>
            </div>

        </div>

    </div>

    <script src="/calci.js"></script>

</body>

</html>
